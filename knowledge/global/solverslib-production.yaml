schemaVersion: 4
rules:
  - id: global.solverslib-production-runtime
    topic: command-runtime-boundary
    title: 正式 Command-Based 代码必须使用 SolversLib
    instruction: >-
      适用范围：已显式选择 command-based（含归一化后包含它的 ftclib-command）的项目，正式代码必须使用固定版本的 SolversLib Command/Subsystem/CommandScheduler 运行时。
      开工前确认实际依赖、com.seattlesolvers.solverslib 包和唯一 scheduler 的生命周期归属；OpMode 负责装配与输入，Subsystem 封装机构，Command 协调动作。
      不以自有调度器、FTCLib 或其他命令框架代替正式运行时，不让两套 scheduler 同时拥有同一机构；项目适配层可复用，但不得仅改类名/import 或添加未使用依赖冒充接入。
      generic、simple-opmode、rookiebot 不因本条改架构；显式 test 任务由裁决器排除此条，不从文件名猜测试身份。旧 ftclib-command 名称保留兼容，normal 下也遵守本条，不自动修改项目配置或升级固定 pin。
      本条是维护者批准的工程政策，作为无条件 soft 要求 Agent 核对真实使用并向用户报告；不代表内核能从 diff 证明依赖存在或正确调度。
    rationale: 维护者明确选择仅约束 command-based 正式代码。global 层覆盖旧共享运行时自选指引，避免同时要求使用 SolversLib 又允许正式代码选择自有或 FTCLib 运行时。
    status: approved
    approval:
      approver: "lucasnotfound59"
      role: overall_software_lead
