  - id: global.solverslib-production-imports
    topic: command-framework
    title: 正式代码不得引入 FTCLib 命令运行时或 core 依赖
    instruction: >-
      正式 command-based 代码使用 SolversLib 命令 API，不新增 com.arcrobotics.ftclib.command 引用或 org.ftclib.ftclib:core 依赖。
      迁移须按固定版本逐项核对依赖、包名与 API，不批量覆盖无关文件。显式 test 架构豁免不允许混装两库；若测试已使用 SolversLib，仍执行其依赖兼容和安全规则。
      hard 仅检查 diff 中确定的旧命令包引用/依赖文本，不证明存量代码、版本目录/动态拼接依赖、自有 scheduler 或真实运行时符合要求；这些仍按 global.solverslib-production-runtime 语义复核。不要求每个 Java/Kotlin 工具文件都 import SolversLib。
    rationale: 以 global 层覆盖旧 Use FTCLib Command 主题，硬拦截可确定的正式代码框架引用；完整架构要求由独立 soft 指令负责，避免逐行要求 import 导致误报。
    status: approved
    approval:
      approver: "lucasnotfound59"
      role: overall_software_lead
      approvedAt: 2026-10-29T02:09:04Z
    authority: shared
    policyLevel: global
    applicability:
