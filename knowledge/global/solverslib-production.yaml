        url: "https://docs.seattlesolvers.com/installation"
        title: "SolversLib Installation"
        publisher: "Seattle Solvers"
        accessedAt: 2026-10-29
        section: "build.gradle; Changing Imports (Only if Migrating from FTCLib)"
    checks:
      - kind: regex-forbidden
        pattern: '\bcom\s*\.\s*arcrobotics\s*\.\s*ftclib\s*\.\s*command\b'
        appliesTo: 'TeamCode/src/main/**/*.{java,kt}'
        note: 正式 Command-Based 代码须使用 com.seattlesolvers.solverslib.command；不得新增 FTCLib 命令包引用。
      - kind: regex-forbidden
        pattern: '(?m)^\s*(?:(?:api|implementation|compileOnly|runtimeOnly)\b[^\r\n]*["'']org\.ftclib\.ftclib:core:|(?:api|implementation|compileOnly|runtimeOnly)\b[^\r\n]*group\s*[:=]\s*["'']org\.ftclib\.ftclib["''][^\r\n]*name\s*[:=]\s*["'']core["''])'
        appliesTo: '**/*.gradle{,.kts}'
        note: 正式 Command-Based 项目不得新增 FTCLib core 依赖；按官方文档选择固定 SolversLib core 版本。
      - kind: regex-forbidden
        pattern: '(?m)^\s*(?:(?:api|implementation|compileOnly|runtimeOnly)\b[^\r\n]*["'']org\.ftclib\.ftclib:core:|(?:api|implementation|compileOnly|runtimeOnly)\b[^\r\n]*group\s*[:=]\s*["'']org\.ftclib\.ftclib["''][^\r\n]*name\s*[:=]\s*["'']core["''])'
        appliesTo: '*.gradle{,.kts}'
        note: 根构建依赖也必须遵守正式代码的 SolversLib 选择。
