  - id: global.naming-conventions
    supersedes: team-20827.naming-conventions
    topic: naming-conventions
    title: Use semantic Java and season-scoped autonomous names
    instruction: 类使用 PascalCase，字段、方法和硬件配置名使用表达机构语义的 lowerCamelCase；不强制电机字段使用 m 前缀。本赛季自动类继续使用 <Side><Color>[Mini] 与 Base 抽象类的组合命名，不据此推断未来赛季路线。
    rationale: 语义化名称便于对应机构职责；取消强制 m 前缀，但保留经本赛季审批的自动类命名范围。
