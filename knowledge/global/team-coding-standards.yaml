  - id: global.constants-centralized
    supersedes: team-20827.constants-centralized
    topic: constants-centralized
    title: Centralize tuning constants
    instruction: 调参与机构参数集中存放并使用能表达用途或单位的名称；可以使用 enum、static final 或配置对象，不在逻辑代码中散落魔数。
    rationale: 20827 与 TeamChina 都集中表达参数；可复用的是语义、单位和集中维护，不是某个固定容器形式或机器人参数值。
