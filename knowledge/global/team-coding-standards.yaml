  - id: global.command-live-input
    topic: command-live-input
    title: Read live command inputs through suppliers
    instruction: 需要连续响应手柄的 Command 通过 Supplier 在执行时读取输入，不在创建 Command 时固定一次性快照。
    rationale: DriveCommand 保存 Supplier 并在执行期间取值，使连续手柄输入在命令存活期间保持更新。
