  - id: global.motor-configuration
    supersedes: team-20827.motor-init-safety
    topic: motor-init-safety
    title: Configure motors for each mechanism
    instruction: 每个电机必须在机构初始化阶段明确配置方向、运行模式和 ZeroPowerBehavior；BRAKE 或 FLOAT 应按机构需要选择，不得无依据统一套用。
    rationale: 初始化需要明确方向、模式和零功率行为；TeamChina 的不同机构采用不同零功率行为，不能把统一 BRAKE 当作通用安全结论。
