  - id: global.documentation-intent
    supersedes: team-20827.chinese-javadoc
    topic: chinese-javadoc
    title: Explain mechanism intent in Chinese
    instruction: 为子系统、工具类和不明显的机构逻辑编写中文说明，重点解释用途、单位、有效范围和安全理由；不强制固定 Javadoc 或分节模板。
    rationale: 中文说明降低队内阅读成本；来源的注释格式并不统一，保留语义说明而不把分节格式当成安全要求。
