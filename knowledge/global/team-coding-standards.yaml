  - id: global.command-requirements-cleanup
    topic: command-requirements-cleanup
    title: Declare requirements and restore safe command output
    instruction: 控制 SubsystemBase 的 CommandBase 显式声明 requirements；产生持续机构输出的命令在结束或中断时恢复安全输出。
    rationale: DriveCommand 声明所控制子系统的 requirements，并在 end 中清理持续输出；这是项目写作约定，不冒充框架官方要求。
