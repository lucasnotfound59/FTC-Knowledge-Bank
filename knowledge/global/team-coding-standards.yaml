  - id: global.hardware-container
    supersedes: team-20827.hardware-container
    topic: hardware-container
    title: Centralize hardware in one Hardwares container
    instruction: 所有硬件引用集中在一个 Hardwares 容器类中，并按 Sensors、Motors、Servos 等职责分组；子系统接收该容器，不直接从 HardwareMap 获取设备。
    rationale: 统一初始化与命名，避免各子系统重复取硬件导致配置漂移。
