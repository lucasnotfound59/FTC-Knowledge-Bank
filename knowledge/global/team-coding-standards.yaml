  - id: global.command-responsibilities
    topic: command-responsibilities
    title: Separate OpMode subsystem and command responsibilities
    instruction: 命令式项目中，OpMode 负责生命周期与输入绑定，Subsystem 封装机构能力，Command 协调动作与调度。
    rationale: 固定提交的 TeleOpSolo 与机构类展示了入口编排、机构能力和命令协调的职责划分；不据此要求所有项目选择命令框架。
