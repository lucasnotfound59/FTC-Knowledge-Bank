  - id: global.telemetry-organization
    supersedes: team-20827.telemetry-multiple
    topic: telemetry-multiple
    title: Organize Driver Station and Dashboard telemetry
    instruction: 项目使用 FtcDashboard 时，通过 MultipleTelemetry 同时提供 Driver Station 与 Dashboard 遥测，并按机构或用途组织关键数据；不强制固定分隔符。
    rationale: 组合遥测同时服务驾驶员与调参者；仅在项目使用 Dashboard 时适用，数据组织比固定分隔符更重要。
