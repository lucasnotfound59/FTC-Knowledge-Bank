        symbol: Intake
        line: 18
  - id: team-20827.telemetry-multiple
    topic: telemetry-multiple
    title: Use MultipleTelemetry with section separators
    instruction: OpMode 使用 MultipleTelemetry（Driver Station + FtcDashboard），并按 “---” 分节展示关键数据。
    rationale: 同一套遥测同时服务驾驶员与调参者，分节让数据可读。
    status: candidate
    authority: team
    applicability:
