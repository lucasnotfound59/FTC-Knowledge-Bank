# 从 xiaokai-lyk/FTC20827-2026Decode 蒸馏的队伍写作规范候选。
# 已按要求排除 CommandOpMode 等改变底层架构的行为（XKCommandOpmode 不作为规范）。
schemaVersion: 1
rules:
  - id: team-20827.hardware-container
    topic: hardware-container
    title: Centralize hardware in one Hardwares container
    instruction: 所有硬件引用集中在一个 Hardwares 容器类中（按 Sensors/Motors/Servos 分组），子系统只接收容器、不直接使用 HardwareMap。
    rationale: 统一初始化与命名，避免各子系统重复取硬件导致配置漂移。
    status: candidate
    authority: team
    applicability:
      teams: ["20827"]
      seasons: ["2025-2026"]
    evidence:
      - repository: xiaokai-lyk/FTC20827-2026Decode
        commit: 118c28e137334bbbea510d77f1fa384e8b1b5779
        file: TeamCode/src/main/java/org/firstinspires/ftc/teamcode/Hardwares.java
        symbol: Hardwares
        line: 17
  - id: team-20827.motor-init-safety
    topic: motor-init-safety
    title: Initialize motors with BRAKE and explicit direction
    instruction: 每个子系统的 init() 必须集中设置电机的 ZeroPowerBehavior.BRAKE 与转动方向。
    rationale: 防止停机滑行与方向错乱，方向设置集中在初始化阶段便于排查。
    status: candidate
    authority: team
    applicability:
      teams: ["20827"]
      seasons: ["2025-2026"]
    evidence:
      - repository: xiaokai-lyk/FTC20827-2026Decode
        commit: 118c28e137334bbbea510d77f1fa384e8b1b5779
        file: TeamCode/src/main/java/org/firstinspires/ftc/teamcode/subsystems/Intake.java
        symbol: setZeroPowerBehavior
        line: 40
  - id: team-20827.constants-centralized
    topic: constants-centralized
    title: Centralize tuning constants
    instruction: 调参常量集中存放（Pedro 参数在 pedroPathing/Constants，子系统常量分节集中），不在逻辑代码中散落魔数。
    rationale: 调参只需改一处；散落的魔数难以复现与评审。
    status: candidate
    authority: team
    applicability:
      teams: ["20827"]
      seasons: ["2025-2026"]
    evidence:
      - repository: xiaokai-lyk/FTC20827-2026Decode
        commit: 118c28e137334bbbea510d77f1fa384e8b1b5779
        file: TeamCode/src/main/java/org/firstinspires/ftc/teamcode/pedroPathing/Constants.java
        symbol: Constants
        line: 17
  - id: team-20827.chinese-javadoc
    topic: chinese-javadoc
    title: Chinese Javadoc with sectioned comments
    instruction: 子系统与工具类使用中文 Javadoc，并用分节注释划分“常量配置 / 成员变量”等区域。
    rationale: 队内以中文交流，统一注释语言与结构降低新人阅读成本。
    status: candidate
    authority: team
