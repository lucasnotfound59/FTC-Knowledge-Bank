        symbol: MultipleTelemetry
        line: 55
  - id: team-20827.naming-conventions
    topic: naming-conventions
    title: Team naming conventions
    instruction: 电机成员用 m 前缀（mLeftFront 等）、硬件配置名用小写驼峰（leftFront）、类用 PascalCase；自动类按 <Side><Color>[Mini] + Base 抽象命名（TopAutoBlue、BottomAutoBaseMini）。
    rationale: 命名一致让硬件配置与代码互相对应，减少接线与代码的错位。
    status: candidate
    authority: team
    applicability:
      teams: ["20827"]
      seasons: ["2025-2026"]
    evidence:
