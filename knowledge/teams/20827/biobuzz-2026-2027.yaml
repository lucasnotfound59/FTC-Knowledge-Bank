  - id: team-20827.biobuzz-point-read-timing
    topic: biobuzz-point-read-timing
    title: "明确点位调参的读取时机"
    instruction: >-
      共享场地点位集中在 Points，自动程序在 INIT 的 buildRoutine() 中解析点位并创建路径，调参后重新 INIT；TeleOp 发起新的射击点路径时再读取目标。蓝方派生 source 通过 Supplier 读取当前红方 Point，避免过早捕获旧对象而忽略 Panels 替换。调参项注明单位、读取时机和重启后的保存方式；需要持久保留时将值写回源码。
    rationale: >-
      点位数值可变不意味着已经构建的路径会实时重建；明确读取时机才能让调参结果可预测。
