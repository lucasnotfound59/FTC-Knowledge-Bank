  - id: team-20827.biobuzz-field-points
    topic: biobuzz-field-points
    title: "统一场地单位，默认旋转生成蓝方并允许单点精调"
    instruction: >-
      BIOBUZZ 场地坐标采用 Alliance 中记录的队内坐标系：距离 inches，Pose 航向 radians 且逆时针为正；Points.Point 的 headingDeg 与接受 headingDegrees 的辅助入口使用 degrees。优先编辑 Points.Red，用绕场地中心 180 度旋转派生 Points.Blue；若蓝方某一点需独立精调，可将该派生项改为存储蓝方场地坐标的 Point/PoseSource，其他点继续派生。redPose/bluePose 使用相应阵营的场地值；pose(x,y,headingDegrees) 仍可用于刻意按 BLUE 创作后依 alliance 转换的流程。一次坐标只转换一次；不得对已派生的 BLUE 值再次旋转，不把本赛季对称性或场地尺寸当成未来赛季事实。
    rationale: >-
      默认共享红方点位减少双边漂移，同时保留实地差异所需的单点独立调整；两种创作入口必须明确单位和转换次数。
