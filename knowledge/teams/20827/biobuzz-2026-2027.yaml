  - id: team-20827.biobuzz-drivetrain-stages
    topic: biobuzz-drivetrain-stages
    title: "按调试阶段选择直接驱动或 Pedro 底盘"
    instruction: >-
      Pedro 跟随器尚未调好时，保留并优先使用 Drive + DriveCommand 的直接驱动方案；机器人中心构造不需要 Localizer，场地中心控制可使用独立 Localizer，但仍需定位器标定与参考姿态。Pedro 调参并验证后，再使用一个 Follower 同时负责手动驾驶、路径和定位：自动程序使用 PathFollower，当前两个 TeleOp 入口使用 PedroDriveTeleOp。不要在同一 OpMode 同时构造 Drive/独立 Localizer 和 Follower/PathFollower，以免重复拥有硬件。现有两个 TeleOp 都属于 Pedro 阶段；前期直接驱动需另建明确入口，不能声称已有可选入口。
    rationale: >-
      两套底盘实现对应不同调试阶段，不能误删前期方案，也不能让同一组电机和定位器被两套实现同时控制。
