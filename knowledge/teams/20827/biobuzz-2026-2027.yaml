    topic: biobuzz-solverslib-hardware-ownership
    title: "使用现有 SolversLib 运行时并明确硬件归属"
    instruction: >-
      比赛命令架构复用项目已选定版本的 SolversLib CommandOpMode、CommandBase 和 SubsystemBase，保持现有包名 com.seattlesolvers.solverslib；不因 FTCLib 教程另建或混入第二套 scheduler。Shooter、Intake、Gate 等机构在各自 subsystem 构造时从 HardwareMap 获取并配置设备，连续控制放入 periodic()；OpMode 负责装配、输入和行为决策。PedroDriveTeleOp 直接持有原始 Follower 是本队现有的明确例外；不要强制另建 Hardwares 总容器。方向、模式和零功率行为按机构需要配置，不照抄其他机器人的参数。
