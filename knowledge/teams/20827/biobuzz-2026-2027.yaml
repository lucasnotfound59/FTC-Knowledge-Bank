  - id: team-20827.biobuzz-shoot-feed-gating
    topic: biobuzz-shoot-feed-gating
    title: "沿用就绪门控与停止清理的射击语义"
    instruction: >-
      扩展现有射击功能时，沿用 Shooter.canOpenGate() 作为开门和射击送料的统一就绪条件。TeleOp 的 RT 请求射击，仅就绪时开 Gate 并运行射击送料，未就绪则关门停送料；RB 仅预旋。自动 shoot(feedSeconds) 先等待就绪，再开始固定送料窗口，窗口内失速时暂停送料但不延长窗口；结束或中断停止 intake 和 shooter 并关闭 gate。自动的就绪等待由停车预留/end guard 提供外层截止，不额外偷偷加入强制送料超时。此规则只描述本机参考行为，不能据此声称就绪阈值已真机验证。
    rationale: >-
      自动与遥控的同一动作应有一致的机构决策语义，避免新功能绕过现有门控。
