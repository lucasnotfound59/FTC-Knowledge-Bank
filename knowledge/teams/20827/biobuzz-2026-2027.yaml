    topic: biobuzz-follower-update-owner
    title: "每个 Follower 明确唯一周期更新者"
    instruction: >-
      自动程序由 PathFollower.periodic() 经 scheduler 更新 Follower；PedroDriveTeleOp 在 beforeDriveRun() 中显式更新原始 Follower，并在 INIT 只更新 localizer。保持同一实例每个运行循环只有一个更新者，不要同时添加手动 follower.update() 和 subsystem periodic 更新；扩展基类时保留原有更新顺序。
    rationale: >-
      自动与 TeleOp 的不同封装是已确认的生命周期选择，重复更新会改变控制循环的时序。
