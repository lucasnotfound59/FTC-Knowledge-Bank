  - id: team-20827.biobuzz-java-naming
    topic: biobuzz-java-naming
    title: "使用完整语义 API 名称并允许 hMap"
    instruction: >-
      队内 Java 类使用 PascalCase，方法和普通字段使用 lowerCamelCase，硬件配置名表达机构语义。新建或修改队内功率和速度 API 使用完整 Power、Velocity，例如 getPower/getLeftPower/getCommandedVelocity；射速配置使用 SHOOT_VELOCITY，并注明 ticks/s。HardwareMap 参数 hMap 和 hardwareMap 均可，不为统一展开 hMap 而重命名。新的阵营参数优先使用 Alliance。厂商 API 和原样引入的第三方源码保持其原有命名。
