  - id: team-20827.biobuzz-mechanism-tuning
    topic: biobuzz-mechanism-tuning
    title: "机构共享参数归属 subsystem"
    instruction: >-
      采集、持球慢速和射击送料分别使用 Intake.INTAKE_POWER、Intake.INTAKE_SLOW_POWER、Intake.SHOOT_INTAKE_POWER；自动持球使用 intakeSlow()，不要在 BlueShoot1Auto 等单条路线中另建相同用途的功率参数。其他机构的共享调参也留在所属 subsystem；路线特有等待、射击时长、停车预留放在该路线类。Panels 可调项使用大写语义名称的 public static 字段，固定常量使用 final，并说明单位与范围。复用参数归属和接口，不把参考机器人的具体数值当作新机器人的已验证值。
    rationale: >-
      同一机构行为使用一个参数来源，避免不同 OpMode 在维护或调参后出现非预期差异。
