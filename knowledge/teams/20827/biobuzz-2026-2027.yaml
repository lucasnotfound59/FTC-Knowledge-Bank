  - id: team-20827.biobuzz-live-controls
    topic: biobuzz-live-controls
    title: "集中控制映射并区分按住与按下沿"
    instruction: >-
      比赛手柄映射集中在 GamepadConfig，调用时读取当前 gamepad 状态。连续驾驶 command 使用 DoubleSupplier 等实时输入，不能在构造时冻结摇杆数值；toggle 和启动路径在调用层检测按下沿，初始化时处理遗留按键。Pedro 手动输入为前进、左移、逆时针正方向，直接 Drive 使用右移和顺时针正方向；在适配边界明确转换。Field-Centric 的 AUTO handoff 驾驶员参考方向、独立启动参考方向与 robot-centric 切换沿用现有基类约定，不能把两套正负号直接混用。
    rationale: >-
      集中映射和明确坐标适配既让操控保持一致，也避免切换底盘阶段后方向反转。
