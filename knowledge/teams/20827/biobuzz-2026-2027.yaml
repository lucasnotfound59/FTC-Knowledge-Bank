  - id: team-20827.biobuzz-autonomous-composition
    topic: biobuzz-autonomous-composition
    title: "使用 BaseAuto 的生命周期与命令组合"
    instruction: >-
      新增比赛自动程序继承 BaseAuto，构造时声明 Alliance，实现 startPose() 和 buildRoutine()；先取得语义化 Pose，再建立命名 Path，最后组合 Command。优先使用 line/curve/follow、spinUp/shoot、intakeOn/intakeSlow/intakeOff、settleAt 等已有辅助接口；复杂航向可直接使用 Paths/Interpolator。保留 INIT 装配、START 调度、end guard 和 STOP 清理边界；评分循环可用 untilSecondsLeft 为最终停车预留时间。逐个核对命令 requirements、结束/中断与机构停止，不将继承基类或编译成功当作异常路径或真机安全保证。自动命名采用当前 <Red|Blue><Routine>Auto 形式，不照搬旧赛季路径名称。
    rationale: >-
      沿用共同生命周期和行为词汇能降低路线扩展的理解成本；复杂路径仍需表达真实航向需求。
