rules:
  - id: shared.gobilda-identify-exact-sku
    topic: gobilda-specification-identity
    title: Identify the exact goBILDA SKU
    instruction: Identify the exact goBILDA product and SKU before applying gear ratio, speed, torque, current, encoder, voltage, PWM, or travel specifications.
    rationale: Products in the same family can have different electrical and mechanical values.
    status: candidate
    authority: shared
    applicability:
      teams: []
      seasons: []
    evidence:
      - type: web
        url: https://www.gobilda.com/5203-series-yellow-jacket-planetary-gear-motor-19-2-1-ratio-24mm-length-8mm-rex-shaft-312-rpm-3-3-5v-encoder/
        title: 5203 Series Yellow Jacket Planetary Gear Motor (19.2:1 Ratio, 24mm Length 8mm REX Shaft, 312 RPM, 3.3 - 5V Encoder)
        publisher: goBILDA
        accessedAt: 2026-08-13
        section: Specs
        product: 5203 Series Yellow Jacket Planetary Gear Motor
        sku: 5203-2402-0019
