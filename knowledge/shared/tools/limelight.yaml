        url: https://docs.limelightvision.io/docs/docs-limelight/getting-started/limelight-3a
        title: Limelight 3A Quick-Start
        publisher: Limelight Vision
        accessedAt: 2026-08-13
        section: Updating LimelightOS
        product: Limelight 3A
