schemaVersion: 3
rules:
  - id: shared.ftc-sdk-pin-release
    topic: ftc-sdk-version-source
    title: Pin the official FTC SDK release
    instruction: Build team projects from an identified FIRST FtcRobotController release or tag and record its FTC SDK version.
    rationale: A rolling branch can change and cannot reproduce a known robot build.
    status: approved
    authority: shared
    approval:
      approver: overall-software-lead
      role: overall_software_lead
      approvedAt: 2026-08-13T00:00:00Z
    applicability:
      teams: []
      seasons: [2025-2026]
    evidence:
      - type: web
        url: https://github.com/FIRST-Tech-Challenge/FtcRobotController/releases/tag/v11.2
        title: FtcRobotController v11.2
        publisher: FIRST Tech Challenge
        accessedAt: 2026-08-13
        section: v11.2 release
        version: v11.2
    checks:
      - kind: regex-forbidden
        pattern: 'org\.firstinspires\.ftc[^\n]*(\+|SNAPSHOT)'
        appliesTo: "**/*.gradle*"
        note: FTC SDK 依赖必须钉住正式 release，禁止 + / SNAPSHOT
  - id: shared.ftc-sdk-preserve-build-tooling
    topic: ftc-sdk-build-tooling
    title: Preserve release-supplied build tooling
    instruction: Use the Gradle Wrapper, Android Gradle Plugin, and Android build configuration supplied by the selected FTC SDK release unless FIRST documents a compatible change.
    rationale: Independent upgrades can make the FTC workspace incompatible with Android Studio or the robot controller runtime.
    status: approved
    authority: shared
    approval:
      approver: overall-software-lead
      role: overall_software_lead
      approvedAt: 2026-08-13T00:00:00Z
    applicability:
      teams: []
      seasons: [2025-2026]
    evidence:
      - type: web
        url: https://github.com/FIRST-Tech-Challenge/FtcRobotController/blob/v11.2/build.gradle
        title: FtcRobotController v11.2 top-level build file
        publisher: FIRST Tech Challenge
        accessedAt: 2026-08-13
        section: buildscript dependencies
        version: v11.2
      - type: web
        url: https://github.com/FIRST-Tech-Challenge/FtcRobotController/blob/v11.2/gradle/wrapper/gradle-wrapper.properties
        title: FtcRobotController v11.2 Gradle Wrapper properties
        publisher: FIRST Tech Challenge
        accessedAt: 2026-08-13
        section: distributionUrl
        version: v11.2
    checks:
      - kind: path-forbidden
        pattern: gradlew
        note: 使用 SDK 发行版自带的 Gradle Wrapper，勿替换
      - kind: path-forbidden
        pattern: gradlew.bat
        note: 使用 SDK 发行版自带的 Gradle Wrapper，勿替换
      - kind: path-forbidden
        pattern: "gradle/wrapper/**"
        note: 使用 SDK 发行版自带的 Wrapper 配置，勿替换
  - id: shared.ftc-sdk-separate-toolchain-versions
    topic: ftc-toolchain-version-record
    title: Record FTC toolchain versions separately
    instruction: Record the Gradle JDK, Java source compatibility, Android SDK levels, and FTC SDK version as distinct values from their actual configuration locations.
    rationale: These similarly named versions control different parts of the build and are not interchangeable.
    status: approved
    authority: shared
    approval:
      approver: overall-software-lead
      role: overall_software_lead
      approvedAt: 2026-08-13T00:00:00Z
    applicability:
      teams: []
      seasons: [2025-2026]
    evidence:
      - type: web
        url: https://developer.android.com/build/releases/agp-8-13-0-release-notes
        title: Android Gradle Plugin 8.13.0
        publisher: Android Developers
        accessedAt: 2026-08-13
        section: Compatibility
        version: "8.13"
      - type: web
        url: https://github.com/FIRST-Tech-Challenge/FtcRobotController/blob/v11.2/build.gradle
        title: FtcRobotController v11.2 top-level build file
        publisher: FIRST Tech Challenge
        accessedAt: 2026-08-13
        section: Android Gradle Plugin dependency
        version: v11.2
      - type: web
        url: https://github.com/FIRST-Tech-Challenge/FtcRobotController/blob/v11.2/build.common.gradle
        title: FtcRobotController v11.2 common Android build configuration
        publisher: FIRST Tech Challenge
        accessedAt: 2026-08-13
        section: Android SDK, NDK, and Java compatibility
        version: v11.2
      - type: web
        url: https://github.com/FIRST-Tech-Challenge/FtcRobotController/blob/v11.2/build.dependencies.gradle
        title: FtcRobotController v11.2 dependency configuration
        publisher: FIRST Tech Challenge
        accessedAt: 2026-08-13
        section: FTC SDK artifacts
        version: v11.2
      - type: web
        url: https://github.com/FIRST-Tech-Challenge/FtcRobotController/blob/v11.2/gradle/wrapper/gradle-wrapper.properties
        title: FtcRobotController v11.2 Gradle Wrapper properties
        publisher: FIRST Tech Challenge
        accessedAt: 2026-08-13
        section: distributionUrl
        version: v11.2
