  - id: shared.command-scheduler-reentrancy
    topic: command-scheduler-reentrancy
    title: 自有 scheduler 的重入、初始化失败与结束幂等
    instruction: >-
      仅在实现或修改自有 scheduler 时，明确 initialize/execute/isFinished/end 等 callback 内 schedule/cancel 的生效顺序，使用延迟队列、快照或等价设计避免遍历集合时被 callback 修改。
      initialize 失败时不得留下活动登记或资源占用，并尝试失败命令已触及机构的安全清理；同一次命令执行最多结束一次，callback 重入及停止期间排队的操作不得复活已停止运行时。
      通过可观察事件轨迹验证重入、冲突、初始化失败和多个 cleanup 抛错的行为。采用 FTCLib 运行时而未修改其实现时，本条不要求重写 vendor scheduler；普通或测试 OpMode 也不因此必须采用命令架构。
    rationale: >-
      FTCLib 固定源码 m_inRunLoop、m_toSchedule、m_toCancel 展示部分周期 callback 的延迟处理，但不提供所有 callback 重入或异常安全保证。全 callback 时序、失败资源释放、结束幂等和清理隔离是拟议自有运行时工程政策，不能从 vendor 的局部队列推定已实现。
