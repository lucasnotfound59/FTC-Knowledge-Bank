  - id: shared.command-default-resumption
    topic: command-default-resumption
    title: 明确 default command 的资源门控与恢复语义
    instruction: >-
      已采用 default command 时，声明其全部 requirements，明确被占用命令抢占、结束/中断后的恢复时机以及安全输出；连续操控在每次执行读取实时输入，而非构造时快照。
      对自有 scheduler，default 仅在其全部 requirements 空闲时恢复，不因某个注册资源空闲而抢占其他仍被使用的资源。
      对 FTCLib 等 vendor 运行时，先核对固定版本的实际 default 语义：FTCLib v2.1.1 只检查注册 subsystem 是否空闲，随后 schedule(default) 仍可能抢占其他 requirements 上可中断的命令。使用者应优先让 default 只占其注册资源，或在应用层明确协调多资源 default，不能假定库自带全资源空闲门控，也不默认要求修改 vendor 源码。
      本条仅约束已存在或正在实现的 default 机制，不强制普通或测试 OpMode 引入 default 或特定基类。
    rationale: >-
      固定源码 setDefaultCommand 校验注册资源且 default 不应结束，run 和 schedule 展示其实际恢复/抢占方式。自有 scheduler 的全资源空闲门控是拟议工程约定，强于 vendor 默认实现；实时输入及安全输出需语义复核，关键词不能证明正确。
