  - id: shared.command-scheduler-lifecycle
    topic: command-scheduler-lifecycle
    title: 明确调度生命周期与逐项安全清理
    instruction: >-
      对已采用命令调度的 OpMode，明确唯一生命周期 owner、INIT 装配、START 后周期调度和 STOP 边界；INIT 中如需周期行为，必须明确允许的动作及安全约束。
      正常结束、中断及初始化/执行异常都应尝试停止接收新调度、取消活动命令并逐项将已拥有机构置于适合机构的安全输出，确保某项 cleanup 抛错仍尝试其他独立项，保留原始故障及清理失败诊断，停止后的旧实例不得再次驱动输出。
      必须核对所用运行时实际保证：FTCLib v2.1.1 的 CommandOpMode 正常循环结束后调用 reset，但 scheduler.reset 仅清 singleton，不等于 cancel/end，也没有 finally 异常清理保证。需要补足时在项目既有生命周期适配层处理，不默认修改 vendor 源码或更换 OpMode 基类；本条不要求未采用命令机制的测试 OpMode 采用架构。
    rationale: >-
      固定 FTCLib 源码支持生命周期调用顺序和 reset 的有限含义；异常路径全量清理、保留原故障及旧实例失效是本库拟议的更强工程政策，不能声称 vendor 已实现。安全输出必须按机构评估，不能一律假定断电或零值安全。
