# Proposed engineering policies; no approval is implied by the vendor evidence.
schemaVersion: 4
rules:
  - id: shared.command-runtime-boundary
    topic: command-runtime-boundary
    title: 明确 Command-Based 运行时归属并复用项目接口
    instruction: >-
      在已选择 Command-Based 架构且本次涉及命令结构时，先确认项目使用自有 Command/Subsystem/scheduler 还是指定版本的 FTCLib 运行时，并复用项目现有接口。
      类 FTCLib 的自有实现不因此需要添加 FTCLib 依赖或照搬其包名、singleton、CommandOpMode 基类或 DSL；使用 FTCLib 时按所选精确版本的 API 和生命周期集成，不让两套 scheduler 同时拥有同一命令或机构。
      本条不要求普通或测试 OpMode 改用命令架构，也不扩大其他已批准规则的适用范围。
    rationale: >-
      FTCLib 固定源码展示了一种运行时和 OpMode 适配方式，不是所有队伍实现必须复制的接口。运行时归属及避免双重资源拥有是拟议共享工程约定，不是 FIRST 官方要求。
    status: approved
    approval:
      approver: "lucas"
      role: overall_software_lead
