    title: "共享项目不提交个人 SDK 路径与构建产物"
    instruction: "适用范围：采用 RookieBot 新手教程约定的项目；不要求其他项目更换架构。共享 FTC 项目不得提交个人 sdk.dir 或 local.properties；使用各自机器生成的 local.properties 或 ANDROID_HOME 配置 Android SDK。忽略 Gradle/build、IDE 和临时 worktree 等本机产物，保留项目所需的 wrapper 与构建配置。说明新电脑需要自己的 JDK、SDK 和依赖准备，不能保证任意环境无需配置就可构建。"
    rationale: "机器专属绝对路径和构建产物会破坏共享仓库的可移植性。"
