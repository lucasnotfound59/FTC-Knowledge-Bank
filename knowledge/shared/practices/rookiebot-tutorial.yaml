        symbol: "Constants"
    positiveExample: |-
      Hardwares hardwares=new Hardwares(hardwareMap);
      follower=hardwares.createFollower();
    negativeExample: "在每个 Auto/TeleOp 内重复 hardwareMap.get() 和 setDirection()。"
  - id: shared.rookiebot-hardware-groups
    topic: rookiebot-hardware-groups
    title: "按 motors、servos、sensors 直接访问设备"
    instruction: "适用范围：采用 RookieBot 新手教程约定的项目；不要求其他项目更换架构。在 Hardwares 中用 Motors、Servos、Sensors 分组并公开设备字段，通过 hardwares.motors.motor1、hardwares.servos.servo1、hardwares.sensors.pinpoint 直接使用。新增设备时同时增加字段与对应分组构造方法内的初始化；新手示例不强加多层 getter、机构包装或调度器。只加载部分分组时明确记录未初始化字段为 null。Pedro 运行时由 Follower 统一输出底盘功率和更新 Pinpoint；不要同时手动写同一组轮子的功率，也不要重复更新或重置定位器。"
    rationale: "保留一个容易查找的设备清单，同时让新手能从调用位置直接定位到硬件声明。"
