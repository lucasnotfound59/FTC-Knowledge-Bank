  - id: shared.rookiebot-servo-degrees
    topic: rookiebot-servo-degrees
    title: "舵机业务变量用度数并统一换算"
    instruction: "适用范围：采用 RookieBot 新手教程约定的项目；不要求其他项目更换架构。RookieBot 位置舵机教程的业务变量使用 0~360 度，并使用 CLOSED_ANGLE_DEGREES 等带单位名称。统一调用 Hardwares.servoAngleToPosition(angleDegrees) 计算 angleDegrees/360.0，再传给 Servo.setPosition；拒绝非有限值及范围外角度，360 映射到 1 而不是绕回 0。明确这只是满行程映射约定，真实转角仍由型号、模式、PWM 与标定决定，不适用于 CRServo 的速度命令。"
    rationale: "新手直接阅读目标角度，换算逻辑只维护一份，同时避免将软件刻度误当作所有舵机的机械能力。"
