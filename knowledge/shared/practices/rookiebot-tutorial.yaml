# RookieBot 新手教程约定：2026-09-07 经用户明确确认，记录为 shared approved。
# 仅适用于采用该教程约定的项目，不代表 FIRST 官方要求或其他项目的架构变更。
schemaVersion: 2
rules:
  - id: shared.rookiebot-hardware-init
    topic: rookiebot-hardware-init
    title: "集中声明和初始化所有硬件"
    instruction: "适用范围：采用 RookieBot 新手教程约定的项目；不要求其他项目更换架构。在采用 RookieBot 新手教程约定的项目中，把所有电机、舵机、传感器的字段、配置名称、查找、方向与初始化集中在 Hardwares。Pedro 内部也会初始化设备，因此 Follower 的硬件构造入口同样放在 Hardwares；Constants 仅保存调参数据，Auto/TeleOp 不另建硬件初始化入口。"
    rationale: "硬件定义只有一个维护位置，避免 Auto、TeleOp 和 Pedro 使用不同名字、方向或重复重置定位器。"
    status: approved
    approval:
      approver: "lucasnotfound59"
      role: overall_software_lead
      approvedAt: 2026-09-06T16:03:37Z
    authority: shared
    applicability:
