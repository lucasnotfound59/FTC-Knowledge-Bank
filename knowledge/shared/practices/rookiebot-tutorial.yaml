  - id: shared.rookiebot-nonblocking-auto
    topic: rookiebot-nonblocking-auto
    title: "用非阻塞步骤组合舵机与路径"
    instruction: "适用范围：采用 RookieBot 新手教程约定的项目；不要求其他项目更换架构。在 init 中初始化并建路径，在 start 中启动首段，在每次 loop 中调用 follower.update。只在进入对应步骤时调用 followPath，以 isBusy 和计时器决定跳转；等待舵机时不能 sleep 或忙等，计时器只在进入等待阶段时重置。STOP 或异常时取消跟随，异常后不要在保护范围外继续查询故障对象；isBusy=false 不等于实物已零误差到点。"
    rationale: "持续更新定位与控制，同时保证舵机等待不会冻结寻路，也避免每帧重启同一路径。"
