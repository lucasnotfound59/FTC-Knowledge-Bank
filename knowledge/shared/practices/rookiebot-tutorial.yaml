    title: "Pedro 构造必须接入底盘和定位器"
    instruction: "适用范围：采用 RookieBot 新手教程约定的项目；不要求其他项目更换架构。参考代码前先核对所选 Pedro 版本。RookieBot 的 Pedro 2.1.2 构造链必须实际提供 drivetrain 和 localizer，再 build()；其麦轮和 Pinpoint 初始化入口在 Hardwares.createFollower。禁止把空 FollowerBuilder.build() 或永远抛错的函数当成完整可配置示例；条件配置锁可保留，但锁后须有真实构造实现。不要照抄参考车的机器人专属调参。"
    rationale: "编译通过只能证明签名可用；缺少底盘或定位器的构造链不能完成初始化。"
