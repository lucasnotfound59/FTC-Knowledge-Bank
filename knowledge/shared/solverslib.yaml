  - id: shared.solverslib-requirements
    topic: solverslib-requirements
    title: 声明 SolversLib 资源占用、default 与结束行为
    instruction: >-
      已使用 SolversLib 的机构命令必须声明实际控制的全部 Subsystem requirements，包括 InstantCommand/RunCommand 等 lambda 命令，不能仅因有硬件引用就假定 scheduler 知道资源占用。
      通过 scheduler 调度，不手动调用另一个命令的 initialize/execute/end 绕过资源仲裁；持续输出命令在 end(boolean interrupted) 同时处理正常结束和取消，恢复机构适合的安全输出。
      default command 声明其注册子系统、保持合理的持续执行语义；连续输入在 execute 时通过 Supplier 读取。固定 0.3.6 源码按注册资源空闲触发 schedule(default)，多资源 default 仍可能抢占其他可中断命令，不假设全资源空闲门控；优先让 default 只占注册资源或显式协调。
      已使用命令机制的测试任务仍遵守这些安全要求，不因架构豁免放松 requirements 或清理。soft 必须向用户报告。
    rationale: scheduler 只依据声明的 requirements 仲裁；固定源码支持资源冲突、default 调度与取消调用顺序，但资源声明的完整性和安全输出需要语义复核。
