  - id: shared.solverslib-composition
    topic: solverslib-composition
    title: 非阻塞执行 SolversLib 命令并正确组合
    instruction: >-
      已使用 SolversLib 的 initialize/execute/isFinished/end/periodic 回调保持非阻塞；等待优先用 WaitCommand/WaitUntilCommand 或跨周期状态，不在回调中 Thread.sleep、忙等或循环等待机构到位。WaitCommand(long) 单位是毫秒，目标版本其他 timeout API 的单位须另行核对，传感器等待要有任务适合的超时与失败处置。
      使用 Sequential/Parallel/Race/Deadline 组合前明确完成、中断和资源语义；同一命令实例不同时复用于多个组合，也不独立 schedule 已属于组合的子命令；并行分支不得占用相同 Subsystem。
      固定 ParallelCommandGroup 源码检查重复 requirements，但不能发现未声明资源；组合完成或 withTimeout 不自动证明机构已到位或输出已停止，必须结合实际 end/interrupted 和观测结果复核。soft 必须向用户报告。
    rationale: 固定 WaitCommand 以毫秒计时、逐周期检查完成；ParallelCommandGroup 与 scheduler 拒绝部分非法组合。非阻塞、资源完整性与超时后安全行为仍是本库工程政策。
