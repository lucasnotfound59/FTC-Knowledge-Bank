  - id: shared.solverslib-lifecycle
    topic: solverslib-lifecycle
    title: 明确 SolversLib 调度周期与停止清理
    instruction: >-
      采用 SolversLib 的 OpMode 必须有唯一 scheduler 生命周期 owner，在主循环周期调用一次调度；覆盖 CommandOpMode.run 时调用 super.run 或明确等价集成，不再额外运行第二次 scheduler，不新建调度线程。
      INIT 只做明确许可的装配/动作，START 后调度运动；核对固定版本的 initialize、initialize_loop、preRun、run、end 顺序以及 STOP during INIT。
      已核验 0.3.6 tag 源码的 initialize 位于 try 之前，之后才由 finally 调用 end/reset；initialize 抛错不受该 finally 保护，空 end 不取消活动命令，scheduler.reset 仅清 singleton，不能当作 cancelAll 或安全停机。
      正常结束、中断和异常都需在项目生命周期适配层尝试取消命令、逐项安全输出并保留原故障；cancel/end 抛错时仍尝试其他独立清理，避免旧实例再次驱动机构。安全值按机构评估，不一律置零。这些异常隔离是工程政策，不宣称 vendor 已保证。soft 必须向用户报告。
    rationale: 固定 SolversLib 源码与 FTCLib 的生命周期并不完全相同；源码中的 finally、reset 和 cancel 回调边界不足以证明硬件已安全停止。
