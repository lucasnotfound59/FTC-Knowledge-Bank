# Vendor facts are pinned; requirements beyond them are approved engineering policy.
schemaVersion: 4
rules:
  - id: shared.solverslib-dependencies
    topic: solverslib-dependencies
    title: 固定 SolversLib 依赖并核对 Pedro 兼容版本
    instruction: >-
      使用或修改 SolversLib 依赖前，核对第一方安装文档、精确版本及对应官方 tag/固定源码；采用 org.solverslib:core 的精确版本与 Dairy releases 仓库，Java/Kotlin 包名前缀是 com.seattlesolvers.solverslib。
      不使用 +、latest 或未经确认的版本替换；不同时安装 FTCLib 和 SolversLib。已有依赖不得仅为追新而自动升级。
      只有实际使用才引入 pedroPathing/photon 扩展；Pedro 扩展不代替 Pedro 本身的安装。2026-10-29 官方安装页对应 SolversLib 0.3.6+ 与 Pedro 3.x、0.3.3–0.3.5 与 Pedro 2.x、0.3.2 与 Pedro 1.0.9、0.3.1 与 Pedro 1.0.8；这不是跨版本 API 兼容保证，目标精确版本仍需核对。
      修改 build.dependencies.gradle 继续执行其第一方证据复核。报告实际 Gradle sync/build 结果，不能把编译成功称为 RC/DS 或真机通过；soft 必须向用户报告。
    rationale: SolversLib 有独立 Maven 坐标、包名及 Pedro 版本对应关系；固定版本证据防止把 FTCLib 示例、旧 Pedro API 或滚动网页当作目标版本保证。
